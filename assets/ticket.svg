<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 210" width="1100" height="210" role="img" aria-labelledby="t">
<title id="t">Ticket: Code in Stereo presents a collab session, featuring Daniel Onyejiekwe and you. Admit one.</title>
<style>
.b{fill:#1ED760;transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.25)}50%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112921"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1ED760"/><stop offset="1" stop-color="#78fbb5"/></linearGradient></defs>
<defs><mask id="m"><rect width="1100" height="210" fill="#fff"/>
<circle cx="850" cy="8" r="16" fill="#000"/><circle cx="850" cy="202" r="16" fill="#000"/>
<circle cx="8" cy="105.0" r="16" fill="#000"/><circle cx="1092" cy="105.0" r="16" fill="#000"/></mask></defs>
<g mask="url(#m)">
<rect x="8" y="8" width="1084" height="194" rx="14" fill="url(#bg)" stroke="#1ED760" stroke-width="2"/>
<clipPath id="sc"><rect x="850" y="0" width="250" height="210"/></clipPath>
<rect x="8" y="8" width="1084" height="194" rx="14" fill="#1ED760" clip-path="url(#sc)"/></g>
<line x1="850" y1="30" x2="850" y2="180" stroke="#0d1117" stroke-width="2" stroke-dasharray="6 6"/>
<text x="56" y="56" fill="#1ED760" font-family="'Courier New', monospace" font-size="13" letter-spacing="4">CODE IN STEREO PRESENTS</text>
<text x="56" y="100" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38">A COLLAB SESSION</text>
<text x="56" y="130" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="17">feat. Daniel Onyejiekwe &amp; You</text>
<text x="56" y="168" fill="#99b0a4" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">VENUE: DANIELONYEJIEKWE.COM   ·   DOORS: ANYTIME   ·   ALL GENRES WELCOME</text>
