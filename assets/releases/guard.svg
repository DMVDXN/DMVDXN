<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="t">
<title id="t">Album cover for Guard</title>
<style>
.b{fill:#1ED760;transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.25)}50%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
.bc{fill:#1ED760;transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112921"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1ED760"/><stop offset="1" stop-color="#78fbb5"/></linearGradient></defs>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d1420"/><stop offset="1" stop-color="#14060a"/></linearGradient>
<clipPath id="c"><rect width="300" height="300" rx="18"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="300" height="300" fill="url(#g)"/>
<g class="spin" style="animation-duration:8s">
<circle cx="228" cy="150" r="118" fill="#050807"/>
<circle cx="228" cy="150" r="104" fill="none" stroke="#1b1f1d" stroke-width="2"/>
<circle cx="228" cy="150" r="88" fill="none" stroke="#1b1f1d" stroke-width="2"/>
<circle cx="228" cy="150" r="72" fill="none" stroke="#1b1f1d" stroke-width="2"/>
<circle cx="228" cy="150" r="40" fill="#FF5C7A"/>
<path d="M228 118 A32 32 0 0 1 260 150" fill="none" stroke="#14060a" stroke-width="3" opacity=".5"/>
<circle cx="228" cy="150" r="5" fill="#14060a"/></g>
<rect width="168" height="300" fill="url(#g)" opacity=".92"/>
<text x="22" y="40" fill="#FF5C7A" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">DMV-003</text>
<text x="22" y="168" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34">GUARD</text>
<rect x="22" y="188" width="40" height="4" rx="2" fill="#FF5C7A"/>
<text x="22" y="270" fill="#c9d1d9" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.5">RESPONSIBLE AI</text></g>
<rect x=".5" y=".5" width="299" height="299" rx="18" fill="none" stroke="#FF5C7A" stroke-opacity=".35"/>
</svg>
