<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 150" width="240" height="150" role="img" aria-labelledby="t">
<title id="t">Code advisory: explicit content, contains code</title>
<style>
.b{fill:#1ED760;transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.25)}50%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
.bc{fill:#1ED760;transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112921"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1ED760"/><stop offset="1" stop-color="#78fbb5"/></linearGradient></defs>
<rect width="240" height="150" fill="#000"/>
<rect x="6" y="6" width="228" height="138" fill="none" stroke="#fff" stroke-width="3"/>
<text x="120.0" y="44" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="1">CODE</text>
<text x="120.0" y="70" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" text-anchor="middle">ADVISORY</text>
<rect x="16" y="82" width="208" height="56" fill="#fff"/>
<text x="120.0" y="106" fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="17" text-anchor="middle">EXPLICIT CONTENT</text>
<text x="120.0" y="128" fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" text-anchor="middle">CONTAINS CODE</text>
</svg>
