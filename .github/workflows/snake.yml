name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Build green contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DMVDXN
          outputs: |
            dist/github-snake.svg?color_snake=%231ED760&color_dots=%23161414,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Publish the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
